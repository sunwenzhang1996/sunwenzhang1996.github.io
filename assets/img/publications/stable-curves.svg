<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 727" role="img" aria-labelledby="title desc">
  <title id="title">Video LLM item-level scaling overview</title>
  <desc id="desc">A three-panel overview showing aggregate scaling curves, item-level churn, and adaptive inference opportunities.</desc>
  <defs>
    <style>
      .title { font: 700 28px Georgia, serif; fill: #05235c; }
      .subtitle { font: 700 19px Georgia, serif; fill: #111; }
      .body { font: 18px Georgia, serif; fill: #111; }
      .small { font: 14px Georgia, serif; fill: #111; }
      .tiny { font: 11px Georgia, serif; fill: #111; }
      .note { font: 700 20px Georgia, serif; fill: #111; }
      .green { fill: #3f7427; }
      .red { fill: #f00; }
      .panel { stroke: #111; stroke-width: 2.2; rx: 10; }
      .soft-line { stroke: #999; stroke-width: 1; }
      .grid { stroke: #c7cfd8; stroke-width: 1; }
      .axis { stroke: #111; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1792" height="727" fill="#fff"/>

  <rect class="panel" x="14" y="21" width="408" height="655" fill="#fff7ef"/>
  <rect class="panel" x="426" y="21" width="899" height="655" fill="#eef6ff" stroke="#0d2c63"/>
  <rect class="panel" x="1328" y="21" width="457" height="655" fill="#f4faee"/>

  <text class="title" x="218" y="50" text-anchor="middle">Aggregate View: Scaling looks</text>
  <text class="title" x="218" y="80" text-anchor="middle">mostly safe.</text>
  <text class="subtitle" x="218" y="115" text-anchor="middle">Accuracy curve of Qwen2.5-VL-7B</text>
  <text class="subtitle" x="218" y="139" text-anchor="middle">(Video-MME-v1)</text>

  <line class="axis" x1="84" y1="449" x2="373" y2="449"/>
  <line class="axis" x1="84" y1="449" x2="84" y2="185"/>
  <polygon points="373,449 362,442 362,456" fill="#111"/>
  <polygon points="84,185 77,197 91,197" fill="#111"/>
  <text class="body" transform="translate(45 339) rotate(-90)" text-anchor="middle">Accuracy</text>
  <text class="body" x="227" y="488" text-anchor="middle">Frames</text>
  <g stroke="#777" stroke-dasharray="2 3">
    <line x1="84" y1="408" x2="361" y2="408"/>
    <line x1="84" y1="363" x2="361" y2="363"/>
    <line x1="84" y1="318" x2="361" y2="318"/>
    <line x1="84" y1="273" x2="361" y2="273"/>
    <line x1="84" y1="230" x2="361" y2="230"/>
  </g>
  <text class="small" x="58" y="411">50</text>
  <text class="small" x="58" y="366">60</text>
  <text class="small" x="58" y="321">70</text>
  <text class="small" x="58" y="276">80</text>
  <text class="small" x="58" y="233">90</text>
  <polyline fill="none" stroke="#111" stroke-width="3" points="122,340 167,326 212,314 260,293 309,297"/>
  <g fill="#3f9bc6" stroke="#111" stroke-width="1.5">
    <circle cx="122" cy="340" r="5"/><circle cx="167" cy="326" r="5"/><circle cx="212" cy="314" r="5"/><circle cx="260" cy="293" r="5"/><circle cx="309" cy="297" r="5"/>
  </g>
  <text class="small" x="111" y="315">65.9</text>
  <text class="small" x="155" y="300">69.0</text>
  <text class="small" x="199" y="289">72.7</text>
  <text class="small" x="247" y="269">76.5</text>
  <text class="small" x="296" y="272">75.8</text>
  <text class="small" x="122" y="468" text-anchor="middle">16</text>
  <text class="small" x="167" y="468" text-anchor="middle">32</text>
  <text class="small" x="212" y="468" text-anchor="middle">64</text>
  <text class="small" x="260" y="468" text-anchor="middle">128</text>
  <text class="small" x="309" y="468" text-anchor="middle">256</text>
  <rect x="22" y="546" width="391" height="119" rx="4" fill="#fff" stroke="#111"/>
  <circle cx="47" cy="580" r="18" fill="#ddd"/><text class="note" x="71" y="586">Aggregate curves appear mostly stable.</text>
  <circle cx="47" cy="632" r="18" fill="#ddd"/><text class="note" x="71" y="637">Average view suggests larger budgets are safe.</text>

  <text class="title" x="876" y="67" text-anchor="middle">Item-level reality: stable averages hide substantial churn.</text>
  <text class="subtitle" x="637" y="114" text-anchor="middle">Item transitions: lower-cost -> higher cost</text>
  <text class="small" x="637" y="137" text-anchor="middle">(e.g., 16f -> 128f)</text>
  <rect x="523" y="200" width="124" height="124" fill="#dbefff" stroke="#2670bd" stroke-width="2"/>
  <rect x="647" y="200" width="122" height="124" fill="#ffe5e1" stroke="#f00" stroke-width="2"/>
  <rect x="523" y="324" width="124" height="124" fill="#dff0d2" stroke="#5c902d" stroke-width="2"/>
  <rect x="647" y="324" width="122" height="124" fill="#dbe8fb" stroke="#2670bd" stroke-width="2"/>
  <text class="small" x="585" y="258" text-anchor="middle">Correct -> Correct</text>
  <text class="small" x="585" y="281" text-anchor="middle">(stable correct)</text>
  <text class="small" x="708" y="258" text-anchor="middle">Correct -> Wrong</text>
  <text class="small" x="708" y="281" text-anchor="middle">(confused items)</text>
  <text class="small red" x="708" y="307" text-anchor="middle">11-31% of items</text>
  <text class="small" x="585" y="382" text-anchor="middle">Wrong -> Correct</text>
  <text class="small green" x="585" y="421" text-anchor="middle">Oracle headroom</text>
  <text class="small green" x="585" y="442" text-anchor="middle">+9-19 points</text>
  <text class="small" x="708" y="382" text-anchor="middle">Wrong -> Wrong</text>
  <text class="small" x="708" y="405" text-anchor="middle">(stable wrong)</text>
  <circle cx="586" cy="231" r="14" fill="#4877d1"/><text class="note" x="586" y="239" text-anchor="middle" fill="#fff">✓</text>
  <circle cx="707" cy="231" r="14" fill="#f00"/><text class="note" x="707" y="239" text-anchor="middle" fill="#fff">×</text>
  <circle cx="582" cy="348" r="14" fill="#5a8b30"/><text class="note" x="582" y="356" text-anchor="middle" fill="#fff">↗</text>
  <circle cx="706" cy="348" r="14" fill="#4877d1"/><text class="note" x="706" y="356" text-anchor="middle" fill="#fff">×</text>
  <rect x="432" y="459" width="184" height="77" rx="3" fill="#f4fff0" stroke="#4e7f27" stroke-width="2"/>
  <text class="note green" x="524" y="491" text-anchor="middle">+ 9-19 pt</text>
  <text class="note green" x="524" y="527" text-anchor="middle">Oracle Headroom</text>
  <rect x="627" y="459" width="230" height="77" rx="3" fill="#fff1f1" stroke="#f00"/>
  <text class="note red" x="742" y="491" text-anchor="middle">11-31%</text>
  <text class="note red" x="742" y="527" text-anchor="middle">Visually confused items</text>
  <rect x="440" y="557" width="417" height="92" rx="3" fill="#fff" stroke="#111"/>
  <text class="note" x="461" y="592">Wrong -> correct and correct -> wrong</text>
  <text class="note" x="493" y="620">flows coexist. Aggregate gains can</text>
  <text class="note" x="493" y="644">mask substantial per-item churn.</text>
  <line x1="871" y1="100" x2="871" y2="667" stroke="#333" stroke-dasharray="2 3"/>

  <text class="subtitle" x="1062" y="114" text-anchor="middle">Per-item trajectory clusters</text>
  <text class="small" x="1062" y="137" text-anchor="middle">(Qwen2.5-VL-7B, Video-MME v1 short)</text>
  <g transform="translate(951 198)">
    <line class="grid" x1="0" y1="247" x2="237" y2="247"/><line class="grid" x1="0" y1="185" x2="237" y2="185"/>
    <line class="grid" x1="0" y1="124" x2="237" y2="124"/><line class="grid" x1="0" y1="62" x2="237" y2="62"/>
    <line class="grid" x1="0" y1="0" x2="237" y2="0"/>
    <line class="grid" x1="43" y1="0" x2="43" y2="247"/><line class="grid" x1="86" y1="0" x2="86" y2="247"/>
    <line class="grid" x1="129" y1="0" x2="129" y2="247"/><line class="grid" x1="172" y1="0" x2="172" y2="247"/>
    <line class="axis" x1="0" y1="247" x2="237" y2="247"/><line class="axis" x1="0" y1="0" x2="0" y2="247"/>
    <polyline points="10,247 53,66 96,38 139,23 182,13 225,9" fill="none" stroke="#285a85" stroke-width="4"/>
    <polyline points="10,247 53,124 96,100 139,111 182,45 225,9" fill="none" stroke="#7657b6" stroke-width="4"/>
    <polyline points="10,247 53,137 96,110 139,172 182,124 225,247" fill="none" stroke="#bf3030" stroke-width="4"/>
    <polyline points="10,9 53,137 96,172 139,198 182,238 225,247" fill="none" stroke="#d8833a" stroke-width="4"/>
    <g fill="#285a85"><circle cx="10" cy="247" r="5"/><circle cx="53" cy="66" r="5"/><circle cx="96" cy="38" r="5"/><circle cx="139" cy="23" r="5"/><circle cx="182" cy="13" r="5"/><circle cx="225" cy="9" r="5"/></g>
    <g fill="#7657b6"><circle cx="10" cy="247" r="5"/><circle cx="53" cy="124" r="5"/><circle cx="96" cy="110" r="5"/><circle cx="139" cy="111" r="5"/><circle cx="182" cy="45" r="5"/><circle cx="225" cy="9" r="5"/></g>
    <g fill="#bf3030"><circle cx="10" cy="247" r="5"/><circle cx="53" cy="137" r="5"/><circle cx="96" cy="110" r="5"/><circle cx="139" cy="172" r="5"/><circle cx="182" cy="124" r="5"/><circle cx="225" cy="247" r="5"/></g>
    <g fill="#d8833a"><circle cx="10" cy="9" r="5"/><circle cx="53" cy="137" r="5"/><circle cx="96" cy="172" r="5"/><circle cx="139" cy="198" r="5"/><circle cx="182" cy="238" r="5"/><circle cx="225" cy="247" r="5"/></g>
    <text class="tiny" x="-10" y="13" text-anchor="end">1.00</text><text class="tiny" x="-10" y="128" text-anchor="end">0.50</text><text class="tiny" x="-10" y="251" text-anchor="end">0.00</text>
    <text class="tiny" x="10" y="274" text-anchor="middle">text-only</text><text class="tiny" x="53" y="274" text-anchor="middle">16f</text>
    <text class="tiny" x="96" y="274" text-anchor="middle">32f</text><text class="tiny" x="139" y="274" text-anchor="middle">64f</text>
    <text class="tiny" x="182" y="274" text-anchor="middle">128f</text><text class="tiny" x="225" y="274" text-anchor="middle">256f</text>
    <text class="body" x="120" y="307" text-anchor="middle">Frame budget</text>
  </g>
  <rect x="884" y="564" width="418" height="87" rx="3" fill="#fff" stroke="#111"/>
  <text class="note red" x="912" y="622" text-anchor="middle">!</text>
  <text class="note" x="934" y="606">Different items respond to scaling in</text>
  <text class="note" x="966" y="632">very different ways.</text>

  <text class="title" x="1556" y="50" text-anchor="middle">Why it matters: better measurement</text>
  <text class="title" x="1556" y="80" text-anchor="middle">and adaptive inference.</text>
  <text class="subtitle" x="1556" y="121" text-anchor="middle">Measurement Problem</text>
  <rect x="1355" y="129" width="196" height="30" fill="#aaa"/>
  <text class="small" x="1453" y="150" text-anchor="middle">Item #204-3 Example</text>
  <g transform="translate(1355 162)">
    <rect width="196" height="144" fill="#ddd" stroke="#fff"/>
    <line x1="43" y1="0" x2="43" y2="144" stroke="#fff"/><line x1="119" y1="0" x2="119" y2="144" stroke="#fff"/>
    <line x1="0" y1="36" x2="196" y2="36" stroke="#fff"/><line x1="0" y1="72" x2="196" y2="72" stroke="#fff"/><line x1="0" y1="108" x2="196" y2="108" stroke="#fff"/>
    <text class="small" x="21" y="23" text-anchor="middle">Frame</text><text class="small" x="81" y="18" text-anchor="middle">Model</text><text class="small" x="157" y="18" text-anchor="middle">Correct?</text>
    <text class="small" x="21" y="60" text-anchor="middle">16</text><text class="small" x="81" y="60" text-anchor="middle">B</text><text class="note red" x="157" y="64" text-anchor="middle">×</text>
    <text class="small" x="21" y="96" text-anchor="middle">64</text><text class="small" x="81" y="96" text-anchor="middle">C</text><text class="note green" x="157" y="100" text-anchor="middle">✓</text>
    <text class="small" x="21" y="132" text-anchor="middle">128</text><text class="small" x="81" y="132" text-anchor="middle">D</text><text class="note red" x="157" y="136" text-anchor="middle">×</text>
  </g>
  <rect x="1554" y="180" width="227" height="119" rx="4" fill="#fff" stroke="#111"/>
  <text class="body" x="1582" y="210">Aggregate curves miss</text>
  <text class="body" x="1582" y="232">item-level failure mode.</text>
  <text class="body" x="1582" y="264">It motivates a per-item</text>
  <text class="body" x="1582" y="287">scaling protocol.</text>
  <text class="subtitle" x="1556" y="368" text-anchor="middle">Operational opportunity</text>
  <g transform="translate(1385 391)">
    <rect x="0" y="0" width="90" height="34" rx="4" fill="#eaf3ff" stroke="#2670bd"/>
    <text class="small" x="45" y="22" text-anchor="middle">Run 16f</text>
    <polygon points="143,17 179,0 215,17 179,34" fill="#fff" stroke="#2670bd"/>
    <text class="tiny" x="179" y="14" text-anchor="middle">Confidence</text><text class="tiny" x="179" y="27" text-anchor="middle">high?</text>
    <rect x="260" y="3" width="60" height="28" rx="4" fill="#f4fff4" stroke="#24964d"/>
    <text class="small green" x="290" y="22" text-anchor="middle">Stop</text>
    <line x1="90" y1="17" x2="143" y2="17" stroke="#444"/><polygon points="143,17 135,12 135,22" fill="#444"/>
    <line x1="215" y1="17" x2="260" y2="17" stroke="#444"/><polygon points="260,17 252,12 252,22" fill="#444"/>
    <text class="tiny green" x="237" y="10" text-anchor="middle">Yes</text>
    <rect x="0" y="70" width="90" height="34" rx="4" fill="#eaf3ff" stroke="#2670bd"/>
    <text class="small" x="45" y="92" text-anchor="middle">Run 32f</text>
    <line x1="179" y1="34" x2="179" y2="70" stroke="#444"/><line x1="179" y1="70" x2="90" y2="87" stroke="#444"/>
    <text class="tiny red" x="203" y="60">No</text>
    <polygon points="143,87 179,70 215,87 179,104" fill="#fff" stroke="#2670bd"/>
    <text class="tiny" x="179" y="84" text-anchor="middle">Confidence</text><text class="tiny" x="179" y="97" text-anchor="middle">high?</text>
    <rect x="260" y="73" width="60" height="28" rx="4" fill="#f4fff4" stroke="#24964d"/>
    <text class="small green" x="290" y="92" text-anchor="middle">Stop</text>
    <line x1="90" y1="87" x2="143" y2="87" stroke="#444"/><line x1="215" y1="87" x2="260" y2="87" stroke="#444"/>
    <text class="tiny green" x="237" y="80" text-anchor="middle">Yes</text>
    <rect x="0" y="140" width="90" height="34" rx="4" fill="#eaf3ff" stroke="#2670bd"/>
    <text class="small" x="45" y="162" text-anchor="middle">Run 128f</text>
    <line x1="179" y1="104" x2="179" y2="140" stroke="#444"/><line x1="179" y1="140" x2="90" y2="157" stroke="#444"/>
    <text class="tiny red" x="203" y="132">No</text>
    <rect x="260" y="143" width="60" height="28" rx="4" fill="#f4fff4" stroke="#24964d"/>
    <text class="small green" x="290" y="162" text-anchor="middle">Stop</text>
    <line x1="90" y1="157" x2="260" y2="157" stroke="#444"/>
  </g>
  <rect x="1357" y="573" width="416" height="63" rx="3" fill="#fff" stroke="#111"/>
  <text class="note green" x="1401" y="604">Matches fixed 128f accuracy with</text>
  <text class="note green" x="1413" y="628">28% lower latency.</text>
</svg>
